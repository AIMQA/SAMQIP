<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAM QIP Diagram Tool — pitch, 2×2, process maps, 5 Whys & driver diagrams</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
<style>
:root{
  --dark:#023D22; --teal:#036E3A; --sea:#098040; --aqua:#DCEFE3; --bg:#F1F6F2;
  --navy:#1B1B1B; --line:#D4E0D8; --grey:#4A5A52; --mint:#7DD08F; --ph:#627267;
}
*{box-sizing:border-box}
body{margin:0;font-family:Calibri,'Segoe UI',Arial,sans-serif;color:var(--navy);background:var(--bg)}
header{background:var(--dark);color:#fff;padding:14px 22px;display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.brand .eyebrow{font-size:10px;letter-spacing:2px;font-weight:bold;color:var(--mint)}
.brand h1{margin:2px 0 0;font-size:20px}
.tabs{display:flex;gap:8px;margin-left:18px}
.tab{border:1px solid var(--sea);background:transparent;color:#fff;padding:7px 16px;border-radius:18px;cursor:pointer;font:inherit;font-size:13px}
.tab.on{background:var(--sea);font-weight:bold}
.spacer{flex:1}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--sea);background:transparent;color:#fff;padding:7px 12px;border-radius:8px;cursor:pointer;font:inherit;font-size:12.5px}
.btn:hover{background:#098040}
.btn:disabled{opacity:.35;cursor:default}
.btn:disabled:hover{background:transparent}
.btn.primary{background:var(--sea);border-color:var(--sea);font-weight:bold}
.hint{padding:9px 22px;font-size:12.5px;color:var(--grey);background:#fff;border-bottom:1px solid var(--line)}
.hint b{color:var(--teal)}
.wprob{background:var(--dark);color:#fff;border-radius:10px;padding:12px 16px;font-weight:bold;font-size:15px;position:relative}
.wcard{background:#fff;border:1px solid var(--teal);border-radius:10px;padding:11px 16px;font-size:15px;color:var(--navy);position:relative;display:flex;align-items:center;gap:12px}
.wcard .wlab{font-size:11px;font-weight:bold;letter-spacing:1.1px;color:var(--dark);white-space:nowrap}
.wroot{background:var(--aqua);border:1px solid var(--teal);border-radius:10px;padding:11px 16px;font-size:15px;font-weight:bold;color:var(--dark);display:flex;align-items:center;gap:12px}
.warrow{text-align:center;font-size:11px;font-style:italic;font-weight:bold;color:var(--teal);padding:5px 0}
.wcard .ntext,.wprob .ntext{text-align:left}
.pcard{position:absolute;display:flex;align-items:stretch;gap:0;border:1px solid var(--teal);border-radius:10px;background:#fff;overflow:hidden}
.pcard .pnum{flex:0 0 42px;background:var(--dark);color:#fff;font-weight:bold;font-size:15px;display:flex;align-items:center;justify-content:center}
.pcard .plab{flex:0 0 128px;background:var(--aqua);color:var(--dark);font-weight:bold;font-size:12px;display:flex;align-items:center;padding:0 12px}
.pcard .ntext{flex:1;text-align:left;font-size:14px;justify-content:flex-start;padding:10px 14px}
.gaxis{position:absolute;background:var(--grey)}
.gtick{position:absolute;font-size:10px;font-weight:bold;letter-spacing:1.2px;color:var(--grey)}
.gquad{position:absolute;font-size:10.5px;font-style:italic;color:var(--ph);pointer-events:none}
.gquad.win{font-style:normal;font-weight:bold;color:var(--teal);background:var(--aqua);border-radius:12px;padding:3px 10px}
.gchip{position:absolute;border:1.4px solid var(--teal);background:#fff;border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.12);cursor:grab;touch-action:none}
.gchip.sel{box-shadow:0 0 0 2.5px var(--sea)}
.gchip.drag{cursor:grabbing;box-shadow:0 6px 16px rgba(0,0,0,.22);z-index:20}
.gchip .ntext{font-size:12.5px;text-align:center;padding:6px 9px}
.gchip .ndel{top:-8px;right:-8px}
.waddw{display:block;margin:10px auto 0;border:1px dashed var(--teal);background:transparent;color:var(--teal);padding:7px 16px;border-radius:18px;cursor:pointer;font:inherit;font-size:13px}
#livebar{display:none;align-items:center;gap:12px;padding:7px 22px;background:#E6F3EA;border-bottom:1px solid #A8D5B5;font-size:12px;color:var(--navy);flex-wrap:wrap}
#livebar.on{display:flex}
#livebar .dot{width:9px;height:9px;border-radius:50%;background:#0A8A46;animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
#livebar b{color:#00622A}
#livebar .code{font-family:Consolas,monospace;font-weight:bold;letter-spacing:1px;background:#fff;border:1px solid #A8D5B5;border-radius:6px;padding:2px 8px}
#livebar button{border:1px solid #A8D5B5;background:#fff;color:var(--navy);padding:4px 10px;border-radius:7px;cursor:pointer;font:inherit;font-size:11.5px}
#livebar button:hover{border-color:#00622A;color:#00622A}
@media print{#livebar{display:none!important}}
@media (max-width:760px){#livebar{padding:7px 12px;font-size:11.5px}}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--dark);color:#fff;padding:11px 20px;border-radius:22px;font-size:13px;font-weight:bold;box-shadow:0 6px 20px rgba(0,0,0,.28);opacity:0;pointer-events:none;transition:opacity .25s;z-index:60;max-width:88vw;text-align:center}
#toast.on{opacity:1}
@media print{#toast{display:none!important}}
#pagebar{padding:8px 22px 0;background:var(--bg);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.plabel{font-size:10px;font-weight:bold;letter-spacing:1.2px;color:var(--grey)}
.pchip{display:flex;align-items:center;gap:7px;border:1px solid var(--teal);background:#fff;color:var(--teal);padding:5px 8px 5px 13px;border-radius:16px;cursor:pointer;font-size:12px;font-weight:bold}
.pchip.on{background:var(--teal);color:#fff}
.pchip .pe{width:16px;height:16px;line-height:15px;text-align:center;border-radius:50%;font-size:10px;font-weight:normal;background:rgba(0,0,0,.10);display:none}
.pchip.on .pe,.pchip:hover .pe{display:inline-block}
.pchip.on .pe{background:rgba(255,255,255,.25)}
.pchip .pe:hover{background:var(--sea);color:#fff}
.pchip .px{width:16px;height:16px;line-height:15px;text-align:center;border-radius:50%;font-size:11px;font-weight:normal;background:rgba(0,0,0,.10)}
.pchip.on .px{background:rgba(255,255,255,.25)}
.pchip .px:hover{background:#da291c;color:#fff}
.paddbtn{border:1px dashed var(--teal);background:transparent;color:var(--teal);padding:5px 12px;border-radius:16px;cursor:pointer;font:inherit;font-size:12px}
#nodebar{padding:8px 22px;background:#fff;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-height:44px}
#nodebar .lbl{font-size:11px;letter-spacing:1.2px;font-weight:bold;color:var(--teal)}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:#fff;padding:6px 11px;font:inherit;font-size:12px;cursor:pointer;color:var(--navy)}
.seg button.on{background:var(--teal);color:#fff;font-weight:bold}
.tbtn{border:1px solid var(--line);background:#fff;color:var(--navy);padding:6px 11px;border-radius:8px;cursor:pointer;font:inherit;font-size:12px}
.tbtn:hover{border-color:var(--teal);color:var(--teal)}
.tbtn.danger:hover{border-color:#da291c;color:#da291c}
.tbtn.red{background:#da291c;border-color:#da291c;color:#fff;font-weight:bold}
.btn.synced{background:#0A8A46;border-color:#0A8A46;color:#fff;font-weight:bold}
.btn.synced:hover{background:#02582F;border-color:#02582F}
.tbtn.red:hover{background:#b81f14;border-color:#b81f14;color:#fff}
#wrap{padding:18px 22px;overflow:auto}
#board{position:relative;width:1120px;background:#fff;border:1px solid var(--line);border-radius:10px;margin:0 auto}
#lines{position:absolute;inset:0;pointer-events:none}
.colhead{position:absolute;top:10px;font-size:11px;font-weight:bold;letter-spacing:1.4px;color:var(--teal)}
.node{position:absolute;font-size:13px;line-height:1.3}
.ntext{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:6px 9px;outline:none;overflow:hidden}
.ntext:empty:before{content:attr(data-ph);color:var(--grey);font-style:italic}
.node.sel .shape, .dnode.sel{box-shadow:0 0 0 2.5px var(--sea)}
.shape{position:absolute;inset:0;border-radius:8px;background:#fff;border:1.6px solid var(--teal)}
.node.terminator .shape{border-radius:44px;background:var(--dark);border-color:var(--dark)}
.node.terminator .ntext{color:#fff;font-weight:bold}
.node.decision .shape{border:0;background:transparent url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 84" preserveAspectRatio="none"><polygon points="75,2 148,42 75,82 2,42" fill="%23DCEFE3" stroke="%23036E3A" stroke-width="2.4"/></svg>') center/100% 100% no-repeat}
.node.decision .ntext{padding:10px 22px;font-size:11.5px}
.node.wait .shape{border-style:dashed;background:var(--bg)}
.node.wait .ntext{font-style:italic}
.nobranch{position:absolute;left:-8px;right:-8px;top:100%;margin-top:3px;font-size:10.5px;font-style:italic;color:var(--grey);text-align:center;outline:none}
.nobranch:empty:before{content:'if no: click to note…';color:var(--grey)}
.branchhead{position:absolute;font-size:10px;font-weight:bold;letter-spacing:1.2px;color:var(--teal)}
.branchlabel{position:absolute;display:flex;align-items:baseline;gap:5px;font-size:11px;color:var(--navy)}
.branchlabel b{color:var(--teal);white-space:nowrap;font-size:10px;letter-spacing:.5px}
.branchnote{outline:none;border-bottom:1px dashed var(--line);min-width:140px;padding:1px 2px}
.branchnote:empty:before{content:attr(data-ph);color:var(--grey);font-style:italic}
.dnode{position:absolute;background:var(--bg);border:1.4px solid var(--line);border-radius:8px;font-size:13px;line-height:1.3}
.dnode .ntext{align-items:center;text-align:left;padding:7px 10px}
.dnode.aim{background:var(--dark);border-color:var(--dark)}
.dnode.aim .ntext{color:#fff;font-weight:bold}
.dnode.primary{background:var(--aqua);border-color:var(--teal)}
.dnode.primary .ntext{font-weight:bold;color:var(--dark)}
.dnode.secondary{background:#fff;border-color:var(--teal)}
.dnode.idea{background:var(--bg)}
.nadd,.ndel{position:absolute;width:20px;height:20px;border-radius:50%;border:0;color:#fff;font-size:13px;line-height:20px;text-align:center;cursor:pointer;padding:0;display:none}
.nadd{background:var(--sea);right:-10px;top:calc(50% - 10px)}
.nsib{position:absolute;width:20px;height:20px;border-radius:50%;border:0;color:#fff;font-size:13px;line-height:20px;text-align:center;cursor:pointer;padding:0;display:none;background:var(--teal);left:calc(50% - 10px);bottom:-10px}
.ndel{background:#627267;right:-8px;top:-8px;font-size:11px}
.ndel:hover{background:#da291c}
.node:hover .nadd,.node:hover .ndel,.dnode:hover .nadd,.dnode:hover .ndel,.dnode:hover .nsib,.wcard:hover .ndel{display:block}
#drvhelp{display:none;padding:10px 22px 0}
.dgrid{display:flex;gap:8px;flex-wrap:wrap}
.dcard{flex:1 1 190px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:10.5px;color:var(--navy)}
.dcard b{display:block;color:var(--teal);font-size:11px;margin-bottom:2px}
.dcard .tst{display:block;color:var(--teal);font-style:italic;margin-top:4px}
.dcard .exm{display:block;color:var(--grey);margin-top:3px}
.dcard .smartlbl{display:block;color:var(--teal);font-size:8.5px;font-weight:bold;letter-spacing:1.1px;margin-top:5px}
.dcard .smartline{display:block;color:var(--navy);font-size:9.3px;margin-top:1.5px}
.dcard .smartline b{display:inline;color:var(--dark);font-size:inherit;margin:0}
.dwarn{margin-top:8px;background:var(--aqua);border-radius:8px;padding:7px 10px;font-size:10.5px;color:var(--navy)}
.dwarn b{color:var(--teal)}
#who{display:none;padding:10px 22px 0}
.whoin{max-width:1120px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.whohead{font-size:10px;font-weight:bold;letter-spacing:1.6px;color:var(--teal)}
.whohead a{color:var(--grey);font-weight:normal;letter-spacing:0;float:right;font-size:10.5px}
.wholine{font-size:11px;color:var(--navy);margin:4px 0 8px}
.howlist{margin:0;padding:0 0 0 18px;columns:2;column-gap:22px}
.howlist li{font-size:10.5px;color:var(--navy);margin-bottom:6px;break-inside:avoid}
.howlist li b{color:var(--teal)}
.whogrid{display:flex;gap:8px;flex-wrap:wrap}
.whocard{flex:1 1 140px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:10.5px;color:var(--grey)}
.whocard b{display:block;color:var(--teal);font-size:11px;margin-bottom:1px}
@media print{#who{display:none!important}#drvhelp{display:none!important}#howto{display:none!important}#pagebar{display:none!important}}
.legend{max-width:1120px;margin:8px auto 0;padding:0 4px;font-size:10.5px;color:var(--grey);display:flex;gap:18px;flex-wrap:wrap}
.legend i{font-style:normal;color:var(--teal);font-weight:bold}
footer{padding:14px 22px;font-size:11px;color:var(--teal)}
footer span{float:right;color:#93A69A}
#fit{margin:0 auto}
#board{transform-origin:0 0}
@media (hover:none),(pointer:coarse){.node .nadd,.node .ndel,.dnode .nadd,.dnode .ndel,.dnode .nsib,.wcard .ndel{display:block}
  .pchip .pe{display:inline-block}}
@media (max-width:760px){
  header{padding:10px 12px;gap:8px}
  .brand h1{font-size:17px}
  .tabs{margin-left:0}
  .tab{padding:6px 12px;font-size:12px}
  .btn{padding:6px 9px;font-size:11.5px}
  .hint{padding:8px 12px;font-size:11.5px}
  #nodebar{padding:8px 12px}
  #pagebar{padding:8px 12px 0}
  .tbtn,.seg button{padding:6px 8px;font-size:11.5px}
  #who{padding:8px 8px 0}
  #drvhelp{padding:8px 8px 0}
  #howto{padding:8px 8px 0}
  .howlist{columns:1}
  #wrap{padding:10px 8px}
  .legend{font-size:10px;gap:10px}
  footer{padding:12px 12px 18px;font-size:10px}
  footer span{float:none;display:block;margin-top:3px}
}
@media print{
  header,.hint,#nodebar,.legend,footer{display:none!important}
  body{background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #wrap{padding:0;overflow:visible}
  #fit{width:auto!important;height:auto!important;margin:0}
  #board{border:0;margin:0;transform:none!important}
  .nadd,.ndel,.nsib{display:none!important}
  .node.sel .shape,.dnode.sel{box-shadow:none!important}
}
@page{size:A4 landscape;margin:10mm}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="eyebrow">SOCIETY FOR ACUTE MEDICINE · QUALITY IMPROVEMENT</div>
    <h1>QIP Diagram Tool</h1>
  </div>
  <div class="tabs">
    <button class="tab" id="tabB" onclick="setMode('pitch')">Pitch</button>
    <button class="tab" id="tabG" onclick="setMode('grid')">2×2 Ideas</button>
    <button class="tab on" id="tabP" onclick="setMode('process')">Process Map</button>
    <button class="tab" id="tabW" onclick="setMode('whys')">5 Whys</button>
    <button class="tab" id="tabD" onclick="setMode('driver')">Driver Diagram</button>
  </div>
  <div class="spacer"></div>
  <div class="actions">
    <button class="btn" id="undobtn" onclick="doUndo()" disabled title="Undo (Ctrl+Z)">↶ Undo</button>
    <button class="btn" id="redobtn" onclick="doRedo()" disabled title="Redo (Ctrl+Y)">↷ Redo</button>
    <button class="btn" onclick="loadExample()">Load example</button>
    <button class="btn" onclick="clearMode()">Clear</button>
    <button class="btn" onclick="openFile()">Open…</button>
    <button class="btn" onclick="saveFile()">Save file</button>
    <button class="btn" onclick="shareLink()">Share link</button>
    <button class="btn" id="collabbtn" onclick="toggleCollab()">Collaborate</button>
    <button class="btn" id="syncbtn" onclick="signInToSync()">Sign in to sync</button>
    <button class="btn" id="fitbtn" onclick="toggleFit()" style="display:none">Zoom 100%</button>
    <button class="btn" onclick="doPrint()">Print / PDF</button>
    <button class="btn primary" onclick="exportPNG()">Download PNG</button>
    <input type="file" id="filein" accept=".json" style="display:none">
  </div>
</header>

<div id="toast"></div>
<div id="livebar"></div>
<div id="pagebar"></div>
<div id="howto"></div>
<div class="hint" id="hint"></div>
<div id="nodebar"></div>
<div id="drvhelp"></div>
<div id="who"></div>
<div id="wrap"><div id="fit"><div id="board"><svg id="lines"></svg><div id="nodes"></div></div></div></div>
<div class="legend" id="legend"></div>
<footer>Society for Acute Medicine&nbsp; | &nbsp;Society for Acute Medicine <span>Stages 1–2 of the QIP Roadmap — export the PNG into your slides or workbook</span></footer>

<script>
"use strict";
/* ---------- state ---------- */
let uid = 1; const nid = () => "n" + (uid++);
const state = {
  mode: "process",
  process: [],
  driver: { aim: "", primaries: [] },
  sel: null
};
function blankProcess(){ return [
  { id: nid(), type: "terminator", text: "Start" },
  { id: nid(), type: "step", text: "" },
  { id: nid(), type: "step", text: "" },
  { id: nid(), type: "terminator", text: "End" }
];}
function blankDriver(){ return { aim: "", primaries: [
  { id: nid(), text: "", secondaries: [ { id: nid(), text: "", ideas: [ { id: nid(), text: "" } ] } ] }
]};}
function blankWhys(){ return { problem: "", whys: ["", "", ""] }; }
const PITCH_LABELS = ["The problem", "The number", "The aim", "Why it matters", "The ask"];
const PITCH_PH = [
  "What\u2019s going wrong, for which patients \u2014 as you\u2019ve seen it on the ward\u2026",
  "One honest local figure: \u201C12 of 20 charts last week\u201D\u2026",
  "From [X] to [Y] by [date]\u2026",
  "The WHO quality domain it targets \u2014 and what it means for patients\u2026",
  "A named supervisor \u2014 and a \u2018yes, go ahead\u2019 to collect baseline data\u2026"
];
function blankPitch(){ return ["", "", "", "", ""]; }
function blankGrid(){ return []; }
state.pages = [{ id: nid(), name: "Page 1", process: blankProcess(), driver: blankDriver(), whys: blankWhys(), pitch: blankPitch(), grid: blankGrid() }];
state.cur = 0;
Object.defineProperty(state, "process", { get(){ return state.pages[state.cur].process; }, set(v){ state.pages[state.cur].process = v; } });
Object.defineProperty(state, "driver", { get(){ return state.pages[state.cur].driver; }, set(v){ state.pages[state.cur].driver = v; } });
Object.defineProperty(state, "whys", {
  get(){ const pg = state.pages[state.cur]; if (!pg.whys) pg.whys = blankWhys(); return pg.whys; },
  set(v){ state.pages[state.cur].whys = v; }
});
Object.defineProperty(state, "pitch", {
  get(){ const pg = state.pages[state.cur]; if (!pg.pitch) pg.pitch = blankPitch(); return pg.pitch; },
  set(v){ state.pages[state.cur].pitch = v; }
});
Object.defineProperty(state, "grid", {
  get(){ const pg = state.pages[state.cur]; if (!pg.grid) pg.grid = blankGrid(); return pg.grid; },
  set(v){ state.pages[state.cur].grid = v; }
});
function uniqueName(base){
  const names = state.pages.map(p => p.name);
  if (!names.includes(base)) return base;
  let i = 2; while (names.includes(base + " " + i)) i++;
  return base + " " + i;
}
function renderPages(){
  const bar = $("pagebar"); bar.innerHTML = "";
  const lab = document.createElement("span"); lab.className = "plabel"; lab.textContent = "PAGES"; bar.appendChild(lab);
  state.pages.forEach((p, i) => {
    const chip = document.createElement("div");
    chip.className = "pchip" + (i === state.cur ? " on" : "");
    chip.title = "Click to open \u00B7 \u270E to rename";
    const nm = document.createElement("span"); nm.textContent = p.name; chip.appendChild(nm);
    const ed = document.createElement("span"); ed.className = "pe"; ed.textContent = "\u270E"; ed.title = "Rename this page";
    ed.onclick = ev => { ev.stopPropagation(); renamePage(i); };
    chip.appendChild(ed);
    const x = document.createElement("span"); x.className = "px"; x.textContent = "\u00D7"; x.title = "Delete page";
    x.onclick = ev => { ev.stopPropagation(); delPage(i); };
    chip.appendChild(x);
    chip.onclick = () => { if (state.cur !== i){ state.cur = i; state.sel = null; render(); } };
    chip.ondblclick = ev => { ev.stopPropagation(); renamePage(i); };
    bar.appendChild(chip);
  });
  const add = document.createElement("button"); add.className = "paddbtn"; add.textContent = "+ New page";
  add.onclick = addPage; bar.appendChild(add);
}
function addPage(){
  const fallback = uniqueName("Page " + (state.pages.length + 1));
  const typed = prompt("Name this page \u2014 usually your QIP or the cycle it covers:", fallback);
  if (typed === null) return;                       // cancelled \u2014 don\u2019t create a stray page
  beginChange();
  const name = uniqueName((typed || "").trim() || fallback);
  state.pages.push({ id: nid(), name: name, process: blankProcess(), driver: blankDriver(), whys: blankWhys(), pitch: blankPitch(), grid: blankGrid() });
  state.cur = state.pages.length - 1; state.sel = null; render();
}
function delPage(i){
  if (state.pages.length === 1){ alert("This is the only page \u2014 use Clear instead."); return; }
  if (!confirm("Delete page \u201C" + state.pages[i].name + "\u201D and both its diagrams?")) return;
  beginChange();
  state.pages.splice(i, 1);
  if (i < state.cur) state.cur--;
  if (state.cur >= state.pages.length) state.cur = state.pages.length - 1;
  state.sel = null; render();
}
function renamePage(i){
  const v = prompt("Name this page \u2014 usually your QIP or the cycle it covers:", state.pages[i].name);
  if (v === null) return;
  const t = v.trim(); if (!t || t === state.pages[i].name) return;
  const others = state.pages.filter((_, k) => k !== i).map(pg => pg.name);
  let name = t, n = 2;
  while (others.indexOf(name) >= 0) name = t + " " + (n++);
  beginChange(); state.pages[i].name = name; render();
}

/* ---------- history (undo / redo) ---------- */
const undoStack = [], redoStack = [];
function snap(){ return JSON.stringify({ pages: state.pages, cur: state.cur }); }
function pushRaw(s){ if (undoStack[undoStack.length - 1] !== s){ undoStack.push(s); if (undoStack.length > 100) undoStack.shift(); } }
function beginChange(){ pushRaw(snap()); redoStack.length = 0; updateHistBtns(); }
function afterChange(){ if (typeof pushLive === "function") pushLive(); if (typeof pushCloudLibrary === "function") pushCloudLibrary(false); saveLocal(); }

/* ---------- local persistence (per browser) \u2014 keeps named projects separate and durable ---------- */
const LS_KEY = "aimqip.v1";
let lsWarned = false;
function saveLocal(){
  if (collab.on) return;   // a live room's pages are not your personal saved set
  try {
    localStorage.setItem(LS_KEY, JSON.stringify({ pages: state.pages, cur: state.cur }));
  } catch (e) {
    if (!lsWarned){ lsWarned = true; showToast("Couldn\u2019t save locally (browser storage full) \u2014 use Save file to keep a copy", 5000); }
  }
}
function loadLocal(){
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return false;
    const j = JSON.parse(raw);
    if (!Array.isArray(j.pages) || !j.pages.length) return false;
    state.pages = j.pages;
    state.cur = Math.min(j.cur || 0, j.pages.length - 1);
    return true;
  } catch (e){ return false; }
}
function blankPageSet(){ state.pages = [{ id: nid(), name: "Page 1", process: blankProcess(), driver: blankDriver(), whys: blankWhys(), pitch: blankPitch(), grid: blankGrid() }]; state.cur = 0; }
function applySnap(s){ const j = JSON.parse(s); state.pages = j.pages; state.cur = Math.min(j.cur || 0, j.pages.length - 1); state.sel = null; render(); }
function doUndo(){ if (!undoStack.length) return; redoStack.push(snap()); applySnap(undoStack.pop()); updateHistBtns(); }
function doRedo(){ if (!redoStack.length) return; undoStack.push(snap()); applySnap(redoStack.pop()); updateHistBtns(); }
function updateHistBtns(){ $("undobtn").disabled = !undoStack.length; $("redobtn").disabled = !redoStack.length; }
document.addEventListener("keydown", e => {
  if (!(e.ctrlKey || e.metaKey)) return;
  if (document.activeElement && document.activeElement.isContentEditable) return;
  const k = e.key.toLowerCase();
  if (k === "z" && !e.shiftKey){ e.preventDefault(); doUndo(); }
  else if (k === "y" || (k === "z" && e.shiftKey)){ e.preventDefault(); doRedo(); }
});

function focusEnd(el){

function editable(cls, txt, ph, oninput){

/* ---------- PROCESS MAP ---------- */
const PW = 150, PH = 84, GX = 46, GY = 78, COLS = 5, PAD = 26;
function pPos(i){
  const row = Math.floor(i / COLS); let col = i % COLS;
  if (row % 2 === 1) col = COLS - 1 - col;
  return { x: PAD + col * (PW + GX), y: PAD + row * (PH + GY), row: row, col: col };
}
function renderProcess(board, svg, nodes){
  const list = state.process;
  const rows = Math.max(1, Math.ceil(list.length / COLS));
  const mainH = rows * (PH + GY) - GY + PAD * 2;
  const branches = [];
  list.forEach((n, i) => { if (n.type === "decision" && n.branch && n.branch.length) branches.push({ decision: n, idx: i }); });
  const BROWH = PH + 42, BGAP = 30;
  const branchH = branches.length ? (24 + branches.length * (BROWH + BGAP)) : 0;
  board.style.height = (mainH + branchH) + "px";
  list.forEach((n, i) => {
    const p = pPos(i);
    const el = document.createElement("div");
    el.className = "node " + n.type + (state.sel === n.id ? " sel" : "");
    el.style.cssText = "left:" + p.x + "px;top:" + p.y + "px;width:" + PW + "px;height:" + PH + "px";
    el.innerHTML = '<div class="shape"></div>';
    el.appendChild(editable("ntext", n.text, "click to type\u2026", v => { n.text = v; }));
    if (n.type === "decision" && !(n.branch && n.branch.length)) el.appendChild(editable("nobranch", n.no, "", v => { n.no = v; }));
    el.addEventListener("mousedown", e => { if (state.sel !== n.id){ e.preventDefault(); state.sel = n.id; render(); } });
    nodes.appendChild(el);
    if (state.sel === n.id) focusEnd(el.querySelector(".ntext"));
  });
  // arrows
  let d = "";
  for (let i = 0; i < list.length - 1; i++){
    const a = pPos(i), b = pPos(i + 1);
    if (a.row === b.row){
      const y = a.y + PH / 2;
      if (b.x > a.x) d += arrow(a.x + PW, y, b.x - 3, y, svg);
      else d += arrow(a.x, y, b.x + PW + 3, y, svg);
    } else {
      const x = a.x + PW / 2;
      d += arrow(x, a.y + PH, x, b.y - 3, svg);
    }
  }
  // branch spurs \u2014 one row per branching decision, below the main grid
  if (branches.length){
    const bh = document.createElement("div"); bh.className = "branchhead";
    bh.style.cssText = "left:" + PAD + "px;top:" + (mainH - GY / 2 + 2) + "px";
    bh.textContent = "\u201CNO\u201D PATHS";
    nodes.appendChild(bh);
  }
  branches.forEach((br, bi) => {
    const rowY = mainH + 24 + bi * (BROWH + BGAP);
    const labY = rowY, boxY = rowY + 36;
    const lw = document.createElement("div"); lw.className = "branchlabel";
    lw.style.cssText = "left:" + PAD + "px;top:" + labY + "px;width:" + (PW * 3) + "px";
    const tag = document.createElement("b"); tag.textContent = "IF NO \u2014";
    lw.appendChild(tag);
    lw.appendChild(editable("branchnote", br.decision.no, "click to note what happens\u2026", v => { br.decision.no = v; }));
    nodes.appendChild(lw);
    let bx = PAD;
    br.decision.branch.forEach((bn, k) => {
      const el = document.createElement("div");
      el.className = "node " + bn.type + (state.sel === bn.id ? " sel" : "");
      el.style.cssText = "left:" + bx + "px;top:" + boxY + "px;width:" + PW + "px;height:" + PH + "px";
      el.innerHTML = '<div class="shape"></div>';
      el.appendChild(editable("ntext", bn.text, "click to type\u2026", v => { bn.text = v; }));
      el.addEventListener("mousedown", e => { if (state.sel !== bn.id){ e.preventDefault(); state.sel = bn.id; render(); } });
      nodes.appendChild(el);
      if (state.sel === bn.id) focusEnd(el.querySelector(".ntext"));
      if (k < br.decision.branch.length - 1) d += arrow(bx + PW, boxY + PH / 2, bx + PW + GX - 3, boxY + PH / 2, svg);
      bx += PW + GX;
    });
    // route via a right-hand gutter so the dashed line never crosses main-grid boxes, whatever row the decision sits in
    const dPos = pPos(br.idx);
    const cx = dPos.x + PW / 2, startX = PAD + PW / 2;
    const gutterX = PAD + COLS * (PW + GX) - GX + 40;
    const dropY = dPos.y + PH + 14, runY = boxY - 12;
    d += '<path d="M' + cx + ',' + (dPos.y + PH) +
      ' L' + cx + ',' + dropY +
      ' L' + gutterX + ',' + dropY +
      ' L' + gutterX + ',' + runY +
      ' L' + startX + ',' + runY +
      ' L' + startX + ',' + (boxY - 3) +
      '" fill="none" stroke="#036E3A" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arr)"/>';
  });
  svg.innerHTML = markerDefs() + d;
  $("who").style.display = "none";
  $("drvhelp").style.display = "none";
  $("hint").innerHTML = "<b>Process map:</b> click a box to select it and type straight in. Use the bar below to change its shape, add the next step, or reorder. On a decision, use <b>+ Add \u201CNo\u201D step</b> to map that path too \u2014 not just note it. Map what <i>actually</i> happens \u2014 walk the route with the people who do the work.";
  $("legend").innerHTML = "<span><i>Pill</i> start / end</span><span><i>Box</i> step</span><span><i>Diamond</i> decision \u2014 can branch below</span><span><i>Dashed</i> wait / delay</span>";
  renderProcessBar();
}
function arrow(x1, y1, x2, y2){
  return '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="#036E3A" stroke-width="2" marker-end="url(#arr)"/>';
}
function markerDefs(){
  return '<defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#036E3A"/></marker></defs>';
}
function renderProcessBar(){
  const bar = $("nodebar"); bar.innerHTML = "";
  const mk = (txt, fn, cls) => { const b = document.createElement("button"); b.className = cls || "tbtn"; b.textContent = txt; b.onclick = () => { beginChange(); fn(); }; bar.appendChild(b); };
  const i = state.process.findIndex(n => n.id === state.sel);
  if (i >= 0){
    const n = state.process[i];
    const l = document.createElement("span"); l.className = "lbl"; l.textContent = "SELECTED SHAPE:"; bar.appendChild(l);
    const seg = document.createElement("div"); seg.className = "seg";
    [["terminator", "Start / End"], ["step", "Step"], ["decision", "Decision"], ["wait", "Wait"]].forEach(t => {
      const b = document.createElement("button"); b.textContent = t[1];
      if (n.type === t[0]) b.className = "on";
      b.onclick = () => { beginChange(); n.type = t[0]; render(); };
      seg.appendChild(b);
    });
    bar.appendChild(seg);
    mk("+ Add step after", () => { const nn = { id: nid(), type: "step", text: "" }; state.process.splice(i + 1, 0, nn); state.sel = nn.id; render(); });
    if (n.type === "decision") mk("+ Add \u201CNo\u201D step", () => { if (!n.branch) n.branch = []; const nn = { id: nid(), type: "step", text: "" }; n.branch.push(nn); state.sel = nn.id; render(); });
    mk("\u25C0 Move earlier", () => { if (i > 0){ const t = state.process[i - 1]; state.process[i - 1] = n; state.process[i] = t; render(); } });
    mk("Move later \u25B6", () => { if (i < state.process.length - 1){ const t = state.process[i + 1]; state.process[i + 1] = n; state.process[i] = t; render(); } });
    mk("Delete", () => { state.process.splice(i, 1); state.sel = null; render(); }, "tbtn danger");
    return;
  }
  for (const dn of state.process){
    if (dn.type !== "decision" || !dn.branch) continue;
    const bi = dn.branch.findIndex(bn => bn.id === state.sel);
    if (bi < 0) continue;
    const bn = dn.branch[bi];
    const l = document.createElement("span"); l.className = "lbl"; l.textContent = "\u201CNO\u201D PATH SHAPE:"; bar.appendChild(l);
    const seg = document.createElement("div"); seg.className = "seg";
    [["step", "Step"], ["wait", "Wait"], ["terminator", "End here"]].forEach(t => {
      const b = document.createElement("button"); b.textContent = t[1];
      if (bn.type === t[0]) b.className = "on";
      b.onclick = () => { beginChange(); bn.type = t[0]; render(); };
      seg.appendChild(b);
    });
    bar.appendChild(seg);
    mk("+ Add step after", () => { const nn = { id: nid(), type: "step", text: "" }; dn.branch.splice(bi + 1, 0, nn); state.sel = nn.id; render(); });
    mk("\u25C0 Move earlier", () => { if (bi > 0){ const t = dn.branch[bi - 1]; dn.branch[bi - 1] = bn; dn.branch[bi] = t; render(); } });
    mk("Move later \u25B6", () => { if (bi < dn.branch.length - 1){ const t = dn.branch[bi + 1]; dn.branch[bi + 1] = bn; dn.branch[bi] = t; render(); } });
    mk("Remove from branch", () => { dn.branch.splice(bi, 1); state.sel = null; render(); }, "tbtn danger");
    return;
  }
  const l = document.createElement("span"); l.className = "lbl"; l.textContent = "NOTHING SELECTED \u2014"; bar.appendChild(l);
  mk("+ Add step at end", () => { const nn = { id: nid(), type: "step", text: "" }; state.process.push(nn); state.sel = nn.id; render(); });
}

/* ---------- DRIVER DIAGRAM ---------- */
const DCOL = [
  { x: 24, w: 190, head: "AIM" },
  { x: 254, w: 205, head: "PRIMARY DRIVERS" },
  { x: 499, w: 225, head: "SECONDARY DRIVERS" },
  { x: 764, w: 330, head: "CHANGE IDEAS" }
];
const DH = 74, DSLOT = 92, DTOP = 44;
function renderDriver(board, svg, nodes){
  const dv = state.driver;
  // leaf slots
  let slot = 0;
  dv.primaries.forEach(p => {
    p._y0 = slot;
    p.secondaries.forEach(sc => {
      sc._y0 = slot;
      const leaves = Math.max(1, sc.ideas.length);
      sc.ideas.forEach((idea, k) => { idea._slot = slot + k; });
      slot += leaves;
      sc._y1 = slot - 1;
    });
    if (!p.secondaries.length){ slot += 1; }
    p._y1 = slot - 1;
  });
  const totalSlots = Math.max(4, slot);
  board.style.height = (DTOP + totalSlots * DSLOT + 20) + "px";
  DCOL.forEach(c => {
    const h = document.createElement("div"); h.className = "colhead";
    h.style.left = c.x + "px"; h.textContent = c.head; nodes.appendChild(h);
  });
  const yFor = s => DTOP + s * DSLOT;
  const mid = (a, b) => yFor((a + b) / 2);
  function newIdea(){ return { id: nid(), text: "" }; }
  function newSec(){ return { id: nid(), text: "", ideas: [newIdea()] }; }
  function newPri(){ return { id: nid(), text: "", secondaries: [newSec()] }; }
  function card(cls, col, y, txt, ph, oninput, adds, del, sib){
    const c = DCOL[col];
    const el = document.createElement("div");
    el.className = "dnode " + cls + (state.sel === oninput.id ? " sel" : "");
    el.style.cssText = "left:" + c.x + "px;top:" + y + "px;width:" + c.w + "px;height:" + DH + "px";
    el.appendChild(editable("ntext", txt, ph, oninput.fn));
    if (adds){ const b = document.createElement("button"); b.className = "nadd"; b.textContent = "+"; b.title = adds.title;
      b.onclick = e => { e.stopPropagation(); beginChange(); adds.fn(); }; el.appendChild(b); }
    if (sib){ const b = document.createElement("button"); b.className = "nsib"; b.textContent = "+"; b.title = sib.title;
      b.onclick = e => { e.stopPropagation(); beginChange(); sib.fn(); }; el.appendChild(b); }
    if (del){ const b = document.createElement("button"); b.className = "ndel"; b.textContent = "\u00D7"; b.title = "Delete";
      b.onclick = e => { e.stopPropagation(); if (confirm("Delete this and everything under it?")){ beginChange(); del(); } }; el.appendChild(b); }
    nodes.appendChild(el);
    return { x: c.x, y: y, w: c.w };
  }
  let d = "";
  const aimY = dv.primaries.length ? mid(dv.primaries[0]._y0, dv.primaries[dv.primaries.length - 1]._y1) : yFor(0);
  const aimPos = card("aim", 0, aimY, dv.aim, "Your SMART aim\u2026", { fn: v => { dv.aim = v; } },
    { title: "Add a primary driver", fn: () => { dv.primaries.push(newPri()); render(); } }, null);
  dv.primaries.forEach(p => {
    const py = mid(p._y0, p._y1);
    const pp = card("primary", 1, py, p.text, "Primary driver\u2026", { fn: v => { p.text = v; } },
      { title: "Add a secondary driver to this one", fn: () => { p.secondaries.push(newSec()); render(); } },
      () => { dv.primaries = dv.primaries.filter(x => x !== p); render(); },
      { title: "Add another primary driver below this one", fn: () => { dv.primaries.splice(dv.primaries.indexOf(p) + 1, 0, newPri()); render(); } });
    d += elbow(aimPos, pp);
    p.secondaries.forEach(sc => {
      const sy = mid(sc._y0, sc._y1);
      const sp = card("secondary", 2, sy, sc.text, "Secondary driver\u2026", { fn: v => { sc.text = v; } },
        { title: "Add a change idea to this one", fn: () => { sc.ideas.push(newIdea()); render(); } },
        () => { p.secondaries = p.secondaries.filter(x => x !== sc); render(); },
        { title: "Add another secondary driver below this one", fn: () => { p.secondaries.splice(p.secondaries.indexOf(sc) + 1, 0, newSec()); render(); } });
      d += elbow(pp, sp);
      sc.ideas.forEach(idea => {
        const iy = yFor(idea._slot);
        const ip = card("idea", 3, iy, idea.text, "Change idea\u2026", { fn: v => { idea.text = v; } }, null,
          () => { sc.ideas = sc.ideas.filter(x => x !== idea); render(); },
          { title: "Add another change idea below this one", fn: () => { sc.ideas.splice(sc.ideas.indexOf(idea) + 1, 0, newIdea()); render(); } });
        d += elbow(sp, ip);
      });
    });
  });
  svg.innerHTML = d;
  $("hint").innerHTML = "<b>Driver diagram:</b> type in the boxes; tap or hover a box for its controls \u2014 <b>+ on the right</b> adds the next level along, <b>+ underneath</b> adds another box at the same level, <b>\u00D7</b> deletes. Read it left to right: to achieve the <b>aim</b>, these <b>drivers</b> must change \u2014 and these <b>change ideas</b> might do it. Pick ONE idea for cycle 1.";
  $("legend").innerHTML = "<span><i>Tip</i>&nbsp; a 15-minute whiteboard version with your team comes first \u2014 this makes it presentable.</span>";
  const bar = $("nodebar"); bar.innerHTML = "";
  const l = document.createElement("span"); l.className = "lbl"; l.textContent = "+ RIGHT = NEXT LEVEL ALONG   \u00B7   + BELOW = ANOTHER AT THIS LEVEL   \u00B7   \u00D7 = DELETE"; bar.appendChild(l);
  renderDrvHelp();
  renderWho();
}

    el.appendChild(del);
    let pending = false, dragging = false, sx = 0, sy = 0, ox = 0, oy = 0, pid = null;
    const wasSel = () => state.sel === item.id;

      sx = e.clientX; sy = e.clientY; ox = item.x; oy = item.y;
      // only block the caret when the chip isn\u2019t already being edited \u2014 otherwise let the click through
      if (!wasSel() || !e.target.closest(".ntext")) e.preventDefault();

      if (!pending) return;

  };

  const g = c.getContext("2d");
  g.fillStyle = "#ffffff"; g.fillRect(0, 0, W, H);
  g.drawImage(cv, Math.round((W - cv.width) / 2), Math.round((H - cv.height) / 2));
  return c;
}
/* Scale the board to fit one A4 landscape page (10mm margins @96dpi). */
function printFit(){
  const board = $("board");
  const bw = 1120, bh = parseInt(board.style.height, 10) || 400;
  const pw = (297 - 20) / 25.4 * 96, ph = (210 - 20) / 25.4 * 96;
  board.style.zoom = Math.min(pw / bw, ph / bh, 1);
}
function printReset(){ $("board").style.zoom = ""; }
window.addEventListener("beforeprint", printFit);
window.addEventListener("afterprint", printReset);
function doPrint(){
  const prevFit = state.fit, prevSel = state.sel;
  state.sel = null; state.fit = false; render();
  printFit();
  window.print();
  setTimeout(() => { printReset(); state.fit = prevFit; state.sel = prevSel; render(); }, 800);
}

function exportPNG(){
  if (typeof html2canvas === "undefined"){
    alert("PNG export needs an internet connection the first time the page loads. Use Print / PDF instead, or reload when online.");
    return;
  }
  state.sel = null;
  const prevFit = state.fit;
  state.fit = false; render();
  html2canvas($("board"), { backgroundColor: "#ffffff", scale: 2 }).then(cv => {
    const pgnm = state.pages[state.cur].name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
    const MODE_FILE = { process: "process-map", whys: "five-whys", driver: "driver-diagram", pitch: "five-sentence-pitch", grid: "2x2-ideas" };
    const mname = MODE_FILE[state.mode] || "diagram";
    const name = (pgnm ? pgnm + "-" : "") + mname + ".png";
    const out = toLandscape(cv);
    out.toBlob(blob => {
      if (!blob){ alert("PNG export failed on this device \u2014 try Print / PDF instead."); return; }
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = name; a.rel = "noopener";
      if ("download" in a){ document.body.appendChild(a); a.click(); a.remove(); }
      else { window.open(url, "_blank"); }
      setTimeout(() => URL.revokeObjectURL(url), 60000);
    }, "image/png");
  }).catch(() => { alert("PNG export failed \u2014 try Print / PDF instead."); })
    .finally(() => { state.fit = prevFit; applyScale(); });
}

/* ---------- share by link (works on a static host \u2014 no server needed) ---------- */
function b64e(s){ return btoa(unescape(encodeURIComponent(s))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); }
function b64d(s){ return decodeURIComponent(escape(atob(s.replace(/-/g, "+").replace(/_/g, "/")))); }
function buildShareUrl(){
  if (collab.on) return location.origin + location.pathname + "?mode=" + state.mode + "&room=" + collab.room;
  const payload = b64e(JSON.stringify({ pages: state.pages, cur: state.cur }));
  return location.origin + location.pathname + "?mode=" + state.mode + "#d=" + payload;
}
function showToast(msg, ms){
  const t = $("toast"); t.textContent = msg; t.className = "on";
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => { t.className = ""; }, ms || 3500);
}
function copyText(txt, ok){
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(ok).catch(() => fallbackCopy(txt, ok));
  } else fallbackCopy(txt, ok);
}
function fallbackCopy(txt, ok){
  const ta = document.createElement("textarea");
  ta.value = txt; ta.setAttribute("readonly", "");
  ta.style.cssText = "position:fixed;top:0;left:-9999px";
  document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, txt.length);
  let done = false;
  try { done = document.execCommand("copy"); } catch (e) {}
  ta.remove();
  if (done) ok(); else window.prompt("Copy this link and paste it to your colleague:", txt);
}
function shareLink(){
  const url = buildShareUrl();
  if (url.length > 12000){
    alert("These pages are too big for a link. Use \u201CSave file\u201D and send the .json instead \u2014 your colleague opens it with \u201COpen\u2026\u201D.");
    return;
  }
  copyText(url, () => showToast("Link copied \u2014 paste it into Teams, e-mail or your workbook", 4500));
}
/* Read a shared diagram out of the URL. replace = fresh load; otherwise merge as extra pages. */
function loadShared(replace){
  const m = (location.hash || "").match(/^#d=(.+)$/);
  if (!m) return false;
  try {
    const j = JSON.parse(b64d(m[1]));
    if (!Array.isArray(j.pages) || !j.pages.length) return false;
    if (replace){
      state.pages = j.pages;
      state.cur = Math.min(j.cur || 0, j.pages.length - 1);
    } else {
      beginChange();
      j.pages.forEach(pg => {
        pg.id = nid();
        const base = (pg.name || "Shared").replace(/ \(shared\)$/, "");
        pg.name = uniqueName(base + " (shared)");
        state.pages.push(pg);
      });
      state.cur = state.pages.length - 1;
    }
    state.sel = null;
    return true;
  } catch (e){ return false; }
}
window.addEventListener("hashchange", () => {
  if (loadShared(false)){ render(); showToast("Shared pages added \u2014 your own pages are untouched", 4500); }
});

/* =========================================================================
   LIVE COLLABORATION & CROSS-DEVICE SYNC (both optional) \u2014 Firebase
   -------------------------------------------------------------------------
   SETUP (about 5\u201310 minutes, free on Firebase\u2019s Spark plan \u2014 no card needed):
     1. console.firebase.google.com \u2192 Add project (analytics not needed).
     2. Build \u2192 Realtime Database \u2192 Create database \u2192 pick a region
        (europe-west1) \u2192 start in LOCKED mode.
     3. Rules tab \u2192 paste the contents of firebase-rules.json \u2192 Publish.
     4. Build \u2192 Authentication \u2192 Get started \u2192 Sign-in method \u2192 enable
        \u201CEmail/Password\u201D \u2192 turn on the \u201CEmail link (passwordless sign-in)\u201D
        toggle within it. (Only needed for cross-device sync, not for rooms.)
     5. Project settings \u2192 Your apps \u2192 Web app (</>) \u2192 register \u2192 copy the
        apiKey and databaseURL out of the config it shows you.
     6. Paste them below, save, push to GitHub. That\u2019s it.
   Leave FB_CONFIG blank and everything else in the tool still works \u2014 the
   Collaborate and \u201CSign in to sync\u201D buttons simply explain they haven\u2019t
   been set up yet.
   NOTE: these keys are meant to be public; the rules are what protect data.
   Never put patient-identifiable data in a shared room or synced project.
   ========================================================================= */
const FB_CONFIG = {
  apiKey: "AIzaSyCmhue-4pHOxLalW8zEy96dmEklhxLARQE",
  databaseURL: "https://aim-qip-qehb-default-rtdb.europe-west1.firebasedatabase.app"
};
const FB_SDK = "https://www.gstatic.com/firebasejs/12.17.0/";
const collab = { on: false, room: null, ref: null, presRef: null, meRef: null, me: null, applying: false, timer: null, people: 1 };
const sync = { on: false, uid: null, email: null, ref: null, applying: false, timer: null, primed: false };

function fbReady(){ return !!(FB_CONFIG.apiKey && FB_CONFIG.databaseURL); }
function loadScript(url){
  return new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = url; s.onload = res; s.onerror = () => rej(new Error("load failed: " + url));
    document.head.appendChild(s);
  });
}
let fbLoading = null;
function loadFirebase(){
  if (window.firebase && firebase.database && firebase.auth) return Promise.resolve();
  if (!fbLoading){
    fbLoading = loadScript(FB_SDK + "firebase-app-compat.js")
      .then(() => Promise.all([loadScript(FB_SDK + "firebase-database-compat.js"), loadScript(FB_SDK + "firebase-auth-compat.js")]))
      .then(() => { if (!firebase.apps.length) firebase.initializeApp(FB_CONFIG); });
  }
  return fbLoading;
}
function roomCode(){
  const A = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";   // no I/O/0/1
  let s = ""; for (let i = 0; i < 6; i++) s += A[Math.floor(Math.random() * A.length)];
  return s;
}
function renderLive(){
  const bar = $("livebar");
  if (!collab.on){ bar.className = ""; bar.innerHTML = ""; $("collabbtn").textContent = "Collaborate"; return; }
  bar.className = "on";
  bar.innerHTML = '<span class="dot"></span><b>Live</b>' +
    '<span>Room <span class="code">' + collab.room + '</span></span>' +
    '<span>' + collab.people + (collab.people === 1 ? " person" : " people") + " editing</span>" +
    '<button onclick="shareLink()">Copy invite link</button>' +
    '<button onclick="leaveRoom()">Leave</button>' +
    '<span style="color:var(--grey)">Everyone in this room edits the same pages \u2014 no patient-identifiable data.</span>';
  $("collabbtn").textContent = "Leave room";
}
function pushLive(){
  if (!collab.on || collab.applying || !collab.primed) return;
  clearTimeout(collab.timer);
  collab.timer = setTimeout(() => {
    collab.ref.child("doc").set({ pages: state.pages, by: collab.me, t: Date.now() }).catch(() => {});
  }, 350);
}
function typingNow(){ return document.activeElement && document.activeElement.isContentEditable; }
let pendingDoc = null;
function applyDoc(d){
  if (!d || !Array.isArray(d.pages) || d.by === collab.me) return;
  if (typingNow()){ pendingDoc = d; return; }            // don\u2019t yank text from under someone
  collab.applying = true;
  state.pages = d.pages;
  if (state.cur >= state.pages.length) state.cur = state.pages.length - 1;
  state.sel = null; render();
  collab.applying = false;
}
document.addEventListener("focusout", () => {
  setTimeout(() => { if (pendingDoc && !typingNow()){ const d = pendingDoc; pendingDoc = null; applyDoc(d); } }, 60);
});
function joinRoom(code, seed){
  return loadFirebase().then(() => {
    collab.room = code;
    collab.me = Math.random().toString(36).slice(2, 10);
    collab.ref = firebase.database().ref("rooms/" + code);
    collab.on = true;
    collab.primed = !!seed;
    if (seed) collab.ref.child("doc").set({ pages: state.pages, by: collab.me, t: Date.now() });
    collab.ref.child("doc").on("value", s => { applyDoc(s.val()); collab.primed = true; });
    collab.presRef = collab.ref.child("presence");
    collab.meRef = collab.presRef.child(collab.me);
    collab.meRef.set(Date.now());
    collab.meRef.onDisconnect().remove();
    collab.presRef.on("value", s => { collab.people = s.numChildren() || 1; renderLive(); });
    const u = new URL(location.href); u.searchParams.set("room", code); u.hash = "";
    history.replaceState(null, "", u.toString());
    renderLive();
  });
}
function leaveRoom(){
  if (!collab.on) return;
  try { collab.ref.child("doc").off(); collab.presRef.off(); collab.meRef.remove(); } catch (e) {}
  collab.on = false; collab.room = null;
  const u = new URL(location.href); u.searchParams.delete("room"); history.replaceState(null, "", u.toString());
  if (!loadLocal()) blankPageSet();   // restore your own saved projects, not the room's
  state.sel = null; render();
  renderLive();
  showToast("Left the room \u2014 back to your own saved projects", 4000);
}
function toggleCollab(){
  if (collab.on){ leaveRoom(); return; }
  if (!fbReady()){
    alert("Live collaboration isn\u2019t switched on for this copy of the tool yet.\n\n" +
          "It needs a free Firebase project (Spark plan \u2014 no payment card): create one, paste the apiKey and databaseURL into FB_CONFIG near the bottom of this file, and publish the rules in firebase-rules.json.\n\n" +
          "Until then, use \u201CShare link\u201D to send your diagrams to colleagues.");
    return;
  }
  const code = roomCode();
  joinRoom(code, true)
    .then(() => { copyText(buildShareUrl(), () => {}); showToast("Live room " + code + " started \u2014 invite link copied", 5000); })
    .catch(() => alert("Couldn\u2019t reach Firebase. Check your connection, or use \u201CShare link\u201D instead."));
}

/* ---------- cross-device sync (optional) \u2014 sign in with an emailed link, your named projects follow you ---------- */
const SYNC_EMAIL_KEY = "aimqip.syncEmail";
function renderSync(){
  const b = $("syncbtn");
  if (sync.on){
    b.textContent = "Synced \u2014 " + sync.email + "  \u00D7";
    b.className = "btn synced";
    b.title = "Click to sign out. Your projects stay on this device \u2014 signing out just stops the cloud copy.";
  } else {
    b.textContent = "Sign in to sync";
    b.className = "btn";
    b.title = "Make your named projects follow you to another device.";
  }
}
function stripIds(v){ return JSON.parse(JSON.stringify(v), (k, val) => k === "id" ? undefined : val); }
function isUntouchedPage(pg){
  if (!pg || pg.name !== "Page 1") return false;
  return JSON.stringify(stripIds(pg.process)) === JSON.stringify(stripIds(blankProcess())) &&
         JSON.stringify(stripIds(pg.driver)) === JSON.stringify(stripIds(blankDriver())) &&
         JSON.stringify(stripIds(pg.whys)) === JSON.stringify(stripIds(blankWhys()));
}
function mergeCloudLibrary(cloudPages, cloudCur){
  if (!Array.isArray(cloudPages) || !cloudPages.length){ pushCloudLibrary(true); return; }  // nothing in the cloud yet \u2014 seed it
  const onlyDefault = state.pages.length === 1 && isUntouchedPage(state.pages[0]);
  sync.applying = true;
  if (onlyDefault){
    state.pages = cloudPages;
    state.cur = Math.min(cloudCur || 0, cloudPages.length - 1);
  } else {
    const cloudIds = new Set(cloudPages.map(p => p.id));
    const extra = state.pages.filter(p => !cloudIds.has(p.id));
    state.pages = cloudPages.concat(extra);
    state.cur = 0;
  }
  sync.applying = false;
  state.sel = null; render();
  pushCloudLibrary(true);   // write the merged result straight back so both sides agree
}
function pushCloudLibrary(immediate){
  if (!sync.on || sync.applying || collab.on) return;
  clearTimeout(sync.timer);
  const go = () => sync.ref.set({ pages: state.pages, cur: state.cur, t: Date.now() }).catch(() => {});
  if (immediate) go(); else sync.timer = setTimeout(go, 500);
}
function attachSync(user){
  sync.on = true; sync.uid = user.uid; sync.email = user.email || user.phoneNumber || "your account";
  sync.ref = firebase.database().ref("users/" + user.uid + "/library");
  try { localStorage.setItem("aimqip.synced", "1"); } catch (e) {}
  sync.ref.get().then(snap => {
    const v = snap.val();
    mergeCloudLibrary(v && v.pages, v && v.cur);
  }).catch(() => showToast("Signed in, but couldn\u2019t reach your synced projects \u2014 check your connection", 4500));
  renderSync();
}
function normalisePhone(v){
  const s = (v || "").replace(/[\s\-().]/g, "");
  if (/^\+\d{8,15}$/.test(s)) return s;                       // full international \u2014 use as-is
  if (/^07\d{9}$/.test(s)) return "+44" + s.slice(1);          // UK mobile shorthand
  if (/^00\d{8,15}$/.test(s)) return "+" + s.slice(2);         // 00 prefix \u2192 +
  return null;
}
function signInToSync(){
  if (sync.on){ signOutOfSync(); return; }
  if (!fbReady()){
    alert("Cross-device sync isn\u2019t switched on for this copy of the tool yet.\n\n" +
          "It needs the same free Firebase project as Collaborate, with a sign-in method turned on (Authentication \u2192 Sign-in method). See COLLABORATION_SETUP.md.\n\n" +
          "Until then, use \u201CSave file\u201D and \u201COpen\u2026\u201D to move projects between devices.");
    return;
  }
  const entry = window.prompt("Your email address, or your mobile number (07\u2026 or +44\u2026) \u2014 we\u2019ll send a one-click link or a 6-digit code. No password, no account to set up.");
  if (!entry || !entry.trim()) return;
  const clean = entry.trim();
  const phone = normalisePhone(clean);
  if (phone){ phoneSignIn(phone); return; }
  if (clean.indexOf("@") > 0){ emailLinkSignIn(clean); return; }
  alert("That doesn\u2019t look like an email address or a mobile number.\n\nUse either your full email, or a mobile as 07\u2026 (UK) or +country-code\u2026 (elsewhere).");
}
function emailLinkSignIn(clean){
  loadFirebase().then(() => {
    const url = location.origin + location.pathname;   // no query string \u2014 Firebase appends its own mode=/oobCode= here
    return firebase.auth().sendSignInLinkToEmail(clean, { url: url, handleCodeInApp: true });
  }).then(() => {
    try { localStorage.setItem(SYNC_EMAIL_KEY, clean); } catch (e) {}
    showToast("Check " + clean + " for a sign-in link \u2014 open it on any device to sync", 6000);
  }).catch(err => alert("Couldn\u2019t send the sign-in link (" + (err && err.message ? err.message : "check your connection") + ")."));
}
let recapVerifier = null;
function clearRecap(){ if (recapVerifier){ try { recapVerifier.clear(); } catch (e) {} recapVerifier = null; } $("recap").innerHTML = ""; }
function phoneSignIn(phone){
  loadFirebase().then(() => {
    clearRecap();
    recapVerifier = new firebase.auth.RecaptchaVerifier("recap", { size: "invisible" });
    return firebase.auth().signInWithPhoneNumber(phone, recapVerifier);
  }).then(conf => {
    const code = window.prompt("We\u2019ve texted a 6-digit code to " + phone + " \u2014 type it here:");
    if (!code || !code.trim()){ clearRecap(); return null; }
    return conf.confirm(code.trim());
  }).then(result => {
    clearRecap();
    if (result && result.user){
      attachSync(result.user);
      showToast("Signed in \u2014 your projects now follow this number to any device", 5500);
    }
  }).catch(err => {
    clearRecap();
    const c = (err && err.code) || "";
    if (c === "auth/operation-not-allowed")
      alert("Phone sign-in isn\u2019t switched on for this Firebase project yet.\n\nConsole \u2192 Authentication \u2192 Sign-in method \u2192 enable Phone. Note: Google requires the Blaze (pay-as-you-go) plan for SMS \u2014 see COLLABORATION_SETUP.md. Email sign-in works without it.");
    else if (c === "auth/invalid-verification-code")
      alert("That code didn\u2019t match \u2014 press \u201CSign in to sync\u201D and try again.");
    else if (c === "auth/invalid-phone-number")
      alert("Firebase didn\u2019t accept that number \u2014 check it and try again as 07\u2026 or +44\u2026");
    else if (c === "auth/too-many-requests")
      alert("Too many attempts from this device \u2014 wait a few minutes, or use email sign-in instead.");
    else
      alert("Couldn\u2019t sign in by phone (" + (err && err.message ? err.message : "check your connection") + "). Email sign-in is the fallback.");
  });
}
function signOutOfSync(){
  if (!sync.on) return;
  try { sync.ref.off(); } catch (e) {}
  try { firebase.auth().signOut(); } catch (e) {}
  try { localStorage.removeItem("aimqip.synced"); } catch (e) {}
  sync.on = false; sync.uid = null; sync.email = null; sync.ref = null;
  renderSync();
  showToast("Signed out \u2014 these projects stay on this device; sign in again anytime to reconnect them", 5000);
}
function completeEmailLinkSignIn(){
  return loadFirebase().then(() => {
    if (!firebase.auth().isSignInWithEmailLink(location.href)) return false;
    let email = null;
    try { email = localStorage.getItem(SYNC_EMAIL_KEY); } catch (e) {}
    if (!email) email = window.prompt("Confirm the email address you requested the sign-in link with:");
    if (!email) return false;
    return firebase.auth().signInWithEmailLink(email, location.href).then(result => {
      try { localStorage.removeItem(SYNC_EMAIL_KEY); } catch (e) {}
      const u = new URL(location.href);
      ["apiKey", "oobCode", "mode", "lang", "continueUrl"].forEach(k => u.searchParams.delete(k));
      history.replaceState(null, "", u.pathname + (u.search || ""));
      attachSync(result.user);
      showToast("Signed in \u2014 your saved projects have joined this device", 5500);
      return true;
    });
  }).catch(err => { alert("That sign-in link didn\u2019t work (" + (err && err.message ? err.message : "it may have expired") + "). Try \u201CSign in to sync\u201D again."); return false; });
}

/* ---------- boot ---------- */
const q = new URLSearchParams(location.search);
if (q.get("mode")){ const m = q.get("mode"); state.mode = ["driver","whys","pitch","grid"].indexOf(m) >= 0 ? m : "process"; }
const hadLocal = loadLocal();                 // restore this browser's own named, separate projects
const opened = loadShared(!hadLocal);         // replace only into a truly empty tool; otherwise merge in as new pages
render();
let bootToasted = false;
if (q.get("room")){
  if (fbReady()){
    joinRoom(q.get("room").toUpperCase(), false)
      .then(() => showToast("Joined live room " + q.get("room").toUpperCase() + " \u2014 you are editing together", 5500))
      .catch(() => alert("Couldn\u2019t join that room \u2014 check your connection."));
    bootToasted = true;
  } else {
    alert("This invite is for a live room, but collaboration isn\u2019t configured on this copy of the tool.");
  }
}
if (opened){
  showToast(hadLocal ? "Shared pages added \u2014 your own saved projects are untouched" : "Opened from a shared link \u2014 edit freely, then Share link to send it back", 6000);
  bootToasted = true;
}
if (q.get("example")) loadExample();
if (fbReady() && q.get("oobCode")){
  bootToasted = true;
  completeEmailLinkSignIn();      // async; renders/toasts itself once it resolves
} else if (fbReady() && (() => { try { return !!localStorage.getItem("aimqip.synced"); } catch (e) { return false; } })()){
  loadFirebase().then(() => {
    firebase.auth().onAuthStateChanged(user => { if (user && !sync.on) attachSync(user); });
  }).catch(() => {});
}
if (!bootToasted && hadLocal) showToast("Welcome back \u2014 your saved projects are just as you left them", 3200);
</script>
